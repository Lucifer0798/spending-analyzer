server.port=${PORT:4000}

# Behind a reverse proxy (Caddy in deploy/server), every request arrives from the proxy's address,
# so the per-caller login lockout would treat all visitors as one -- a few wrong guesses by anyone
# would lock the owner out. `native` makes Tomcat take the client address and https scheme from
# X-Forwarded-For / X-Forwarded-Proto, but only when the request comes from a private-range
# address (its default trusted-proxy list). Off by default on purpose: with a container port
# published straight to the internet, Docker's port forwarding makes outside callers appear to
# come from a private address too, and they could then forge X-Forwarded-For to dodge the lockout.
# Turn it on only where nothing but the proxy can reach the app.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Defaults to data.sqlite next to wherever the app was started, which is what a local
# `./mvnw spring-boot:run` wants. Containers set SPENDING_ANALYZER_DB to a path on a
# mounted volume so the database outlives the container.
spring.datasource.url=jdbc:sqlite:${SPENDING_ANALYZER_DB:${user.dir}/data.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC

# sqlite-jdbc has no real connection pool semantics; keep it to a single connection
spring.datasource.hikari.maximum-pool-size=1

# Schema is owned by Flyway (src/main/resources/db/migration), not spring.sql.init.
# baseline-on-migrate lets databases created before Flyway was introduced (which
# already have the V1 tables but no history table) adopt migrations from V2 onward.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# A single shared password guards the whole app. Blank means no authentication at all, which
# is the right default for `mvnw spring-boot:run` on your own machine — the app's whole premise
# is local, private data with no account to sign up for.
#
# That default is only safe because nothing reachable ships with it: compose.yaml sets
# app.auth.required=true, so a container refuses to start without a password rather than
# quietly coming up open on a network.
app.auth.password=${APP_PASSWORD:}
app.auth.required=${APP_AUTH_REQUIRED:false}

# Brute-force protection on that one login endpoint: this many consecutive wrong passwords from
# the same caller address locks it out for this many minutes. Per-caller, not global, so someone
# guessing from one network never blocks the owner signing in from another.
app.auth.max-attempts=${APP_AUTH_MAX_ATTEMPTS:5}
app.auth.lockout-minutes=${APP_AUTH_LOCKOUT_MINUTES:15}

# Packaged as one artifact the frontend is same-origin, so CORS is only needed for the Vite
# dev server. The port is a wildcard because Vite silently moves to 5174 (and up) when 5173
# is taken by another project, and pinning 5173 turns that into 403s on every write.
# Loopback only, so this is still not the blanket "*" it replaced. Comma-separated; set
# CORS_ALLOWED_ORIGINS to widen it, or blank to turn CORS off entirely.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.com.spendinganalyzer=INFO
