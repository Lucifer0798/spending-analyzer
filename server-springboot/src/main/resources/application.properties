server.port=4000

spring.datasource.url=jdbc:sqlite:${user.dir}/data.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# sqlite-jdbc has no real connection pool semantics; keep it to a single connection
spring.datasource.hikari.maximum-pool-size=1

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.level.com.spendinganalyzer=INFO
