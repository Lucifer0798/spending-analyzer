# Profile-specific on purpose: a plain application.properties here would sit earlier
# on the classpath than the one in src/main/resources and replace it wholesale,
# silently dropping spring.sql.init.mode so the schema is never applied.
# A profile-specific file layers on top of the main one instead.

# Keep tests off the development database.
spring.datasource.url=jdbc:sqlite:target/test-data.sqlite
