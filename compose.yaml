services:
  app:
    build: .
    image: spending-analyzer
    ports:
      - "4000:4000"
    env_file:
      # Reuses the same .env as a local run. Optional — without a key everything except AI
      # categorization and predictions still works.
      - path: server-springboot/.env
        required: false
    environment:
      # Same-origin once packaged, so the Vite dev-server exception is not wanted here.
      - CORS_ALLOWED_ORIGINS=
      # Listed without a value so the host's variable is passed through when set and left
      # alone when not — writing `ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}` would override
      # whatever .env supplied with an empty string.
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL
    volumes:
      - spending-data:/data
    restart: unless-stopped

volumes:
  spending-data:
