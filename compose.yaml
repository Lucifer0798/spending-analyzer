services:
  app:
    build: .
    image: spending-analyzer
    ports:
      - "4000:4000"
    env_file:
      # Optional: where APP_PASSWORD can live instead of being exported before `docker compose up`.
      - path: server-springboot/.env
        required: false
    environment:
      # Same-origin once packaged, so the Vite dev-server exception is not wanted here.
      - CORS_ALLOWED_ORIGINS=
      # The password guarding this instance. The image sets APP_AUTH_REQUIRED=true, so if this
      # is unset the container stops with an explanatory message instead of starting open.
      # Put APP_PASSWORD in server-springboot/.env, or export it before `docker compose up`.
      # Listed without a value so the host's variable is passed through when set and left
      # alone when not — writing `APP_PASSWORD: ${APP_PASSWORD:-}` would override whatever
      # .env supplied with an empty string.
      - APP_PASSWORD
    volumes:
      - spending-data:/data
    restart: unless-stopped

volumes:
  spending-data:
