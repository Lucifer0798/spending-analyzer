name: CodeQL

# Free for public repositories. Runs on every change like the rest of CI, plus weekly:
# CodeQL ships new queries over time, so a scheduled run finds problems in code that has
# not changed since the last push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesday 07:00 Asia/Kolkata. Deliberately not Monday, when Dependabot opens its
    # pull requests, so the two do not compete for runners.
    - cron: '30 1 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      # Writing the results back to the Security tab is the whole point.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Java is compiled for analysis rather than scanned buildless, which gives CodeQL
          # resolved types and so far fewer false positives on a Spring codebase.
          - language: java-kotlin
            build-mode: manual
          # Nothing to compile: the extractor reads the TypeScript sources directly, and a
          # Vite bundle would only hide the original code from it.
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Java
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches the CI server job and the Dockerfile, so CodeQL analyses the code as it
          # is actually compiled.
          java-version: '25'
          cache: maven

      # Compile only — the test sources and the frontend profile add nothing to the analysis
      # and would make this job several minutes slower.
      - name: Build for analysis
        if: matrix.build-mode == 'manual'
        working-directory: server-springboot
        run: ./mvnw -B -ntp -DskipTests compile

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
