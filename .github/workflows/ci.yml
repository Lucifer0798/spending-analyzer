name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when new commits land on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  server:
    name: Server (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-springboot
    steps:
      - uses: actions/checkout@v7

      # Matches the JDK in the Dockerfile: the tests should run on the runtime that ships,
      # not one major behind it. The compile target stays at 21 (see pom.xml), so the jar
      # still runs on a 21 JRE for anyone not using the image.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: server-springboot/target/spending-analyzer.jar
          retention-days: 7

  # The client and server jobs above check each half in isolation. This one checks the thing
  # that actually ships: one image, with the frontend packaged inside the jar. Building it is
  # only half the check — the image is started and probed, because a container that builds and
  # then fails to boot is exactly the failure the smoke test exists to catch.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the publish steps at the end, which run on main only.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t spending-analyzer:ci .

      # The image sets APP_AUTH_REQUIRED=true, so this also proves that a password is enough
      # to start it — the refusal path is covered by the step below.
      - name: Start container
        run: docker run -d --name app -p 4000:4000 -e APP_PASSWORD=ci-smoke-test spending-analyzer:ci

      - name: Wait for it to come up
        run: |
          # /api/auth/status is the one endpoint outside the gate, so it is what a health
          # check or a load balancer should poll. Everything else answers 401 until sign-in.
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4000/api/auth/status; then
              echo "up"; exit 0
            fi
            sleep 2
          done
          echo "::error::container did not become healthy within 120s"
          docker logs app
          exit 1

      - name: Check the packaged frontend is served and the API is locked
        run: |
          curl -sf http://localhost:4000/ | grep -qi '<div id="root">'
          curl -sf http://localhost:4000/api/auth/status | grep -q '"authRequired":true'

          # The whole point of shipping with a password: data endpoints must refuse a caller
          # who has not signed in. A 200 here would mean the image ships wide open.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/summary)
          if [ "$status" != "401" ]; then
            echo "::error::/api/summary answered $status to an unauthenticated caller, expected 401"
            exit 1
          fi

      - name: Check it refuses to start with no password
        run: |
          # Silently falling back to an open instance is the failure this guards against, so
          # the container must exit rather than come up.
          if docker run --rm --name no-password spending-analyzer:ci; then
            echo "::error::container started without APP_PASSWORD, expected it to refuse"
            exit 1
          fi
          echo "refused to start without a password, as intended"

      # Publishing comes after the checks above and runs only on main, so what reaches the
      # registry is exactly the image that was just proved to boot, serve the frontend, refuse
      # an unauthenticated caller, and refuse to start without a password. A pull request builds
      # and tests the image but never pushes one.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # GHCR rejects uppercase in a repository path, and this owner has some.
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          sha="${GITHUB_SHA::7}"

          # Two tags on purpose: latest for "just run it", the commit for pinning and for
          # working out afterwards which code a running container actually came from.
          docker tag spending-analyzer:ci "$image:latest"
          docker tag spending-analyzer:ci "$image:$sha"
          docker push "$image:latest"
          docker push "$image:$sha"

          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker pull $image:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker pull $image:$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker logs app

      - name: Stop container
        if: always()
        run: docker rm -f app
