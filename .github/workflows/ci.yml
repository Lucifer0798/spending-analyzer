name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when new commits land on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  server:
    name: Server (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-springboot
    steps:
      - uses: actions/checkout@v7

      # Matches the JDK in the Dockerfile: the tests should run on the runtime that ships,
      # not one major behind it. The compile target stays at 21 (see pom.xml), so the jar
      # still runs on a 21 JRE for anyone not using the image.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: server-jar
          path: server-springboot/target/spending-analyzer.jar
          retention-days: 7

  # The client and server jobs above check each half in isolation. This one checks the thing
  # that actually ships: one image, with the frontend packaged inside the jar. Building it is
  # only half the check — the image is started and probed, because a container that builds and
  # then fails to boot is exactly the failure the smoke test exists to catch.
  #
  # Built natively per architecture rather than cross-built under emulation: amd64 here, arm64
  # in the job below on GitHub's Arm runner (free for public repositories). Each one runs the
  # same smoke test before it is pushed, and `publish` only joins them into one multi-arch tag
  # once both have passed. This job keeps the name "Docker image" because branch protection
  # requires a check by that name.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the push at the end, which runs on main only.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t spending-analyzer:ci .

      - name: Smoke test
        uses: ./.github/actions/image-smoke-test
        with:
          image: spending-analyzer:ci

      # Publishing comes after the checks above and runs only on main, so what reaches the
      # registry is exactly the image that was just proved to boot, serve the frontend, refuse
      # an unauthenticated caller, and refuse to start without a password. A pull request builds
      # and tests the image but never pushes one. This pushes only an architecture-specific tag;
      # `publish` turns the pair into the tags people actually pull.
      - name: Push amd64 image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          # GHCR rejects uppercase in a repository path, and this owner has some.
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker tag spending-analyzer:ci "$image:${GITHUB_SHA::7}-amd64"
          docker push "$image:${GITHUB_SHA::7}-amd64"

      - name: Container logs
        if: always()
        run: docker logs app || true

      - name: Stop container
        if: always()
        run: docker rm -f app || true

  # The same build and smoke test on arm64 -- the architecture of the free Ampere VMs on Oracle
  # Cloud and of Apple-silicon and Raspberry Pi machines. Not a required check (that would mean
  # changing branch protection), but `publish` won't run without it, so nothing reaches `latest`
  # unless this architecture booted and passed too.
  image-arm64:
    name: Docker image (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t spending-analyzer:ci .

      - name: Smoke test
        uses: ./.github/actions/image-smoke-test
        with:
          image: spending-analyzer:ci

      - name: Push arm64 image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker tag spending-analyzer:ci "$image:${GITHUB_SHA::7}-arm64"
          docker push "$image:${GITHUB_SHA::7}-arm64"

      - name: Container logs
        if: always()
        run: docker logs app || true

      - name: Stop container
        if: always()
        run: docker rm -f app || true

  # Joins the two tested architecture images into one multi-arch tag, so `docker pull` picks the
  # right one for whatever machine runs it. No rebuild happens here -- the manifest list points at
  # exactly the images the two jobs above tested and pushed.
  publish:
    name: Publish image
    needs: [image, image-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Create multi-arch tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          sha="${GITHUB_SHA::7}"

          # Two tags on purpose: latest for "just run it", the commit for pinning and for
          # working out afterwards which code a running container actually came from.
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:$sha" \
            "$image:$sha-amd64" "$image:$sha-arm64"
          docker buildx imagetools inspect "$image:$sha"

          echo "### Published (linux/amd64 + linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker pull $image:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker pull $image:$sha\`" >> "$GITHUB_STEP_SUMMARY"
