# Spending Analyzer on a single VM (written for an Oracle Cloud Always Free Ampere VM, but nothing
# here is Oracle-specific). Two containers:
#   app   -- the published image, reachable only from caddy on this compose network
#   caddy -- the only thing listening on the internet; terminates HTTPS with a free, automatically
#            renewed Let's Encrypt certificate and forwards to app
# Settings come from .env next to this file -- copy .env.example and fill it in. See README.md.
services:
  app:
    image: ghcr.io/lucifer0798/spending-analyzer:latest
    environment:
      # The image refuses to start without a password; failing here says why, before it tries.
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      # Caddy is the only caller, so trust its X-Forwarded-For: without this the login lockout
      # sees every visitor as Caddy's address and a few wrong guesses by anyone lock you out too.
      # Safe here precisely because app publishes no port -- see application.properties.
      FORWARD_HEADERS_STRATEGY: native
      # Same-origin behind Caddy, so no CORS exception is wanted.
      CORS_ALLOWED_ORIGINS: ""
    volumes:
      - spending-data:/data
    restart: unless-stopped
    # Deliberately no `ports:` -- nothing outside this compose network can reach the app directly.

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"      # Let's Encrypt's HTTP challenge, and redirects to https
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates -- kept so a restart doesn't request new ones
      - caddy-config:/config
    restart: unless-stopped

volumes:
  spending-data:
  caddy-data:
  caddy-config:
